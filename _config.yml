# Site configuration for https://manuelweiss.info
# Changes to this file require restarting `bundle exec jekyll serve`.

# Site
locale                   : "en-US"
title                    : "Manuel Weiss"
title_separator          : "-"
name                     : "Manuel Weiss"
description              : "PhD student at BHT Berlin and Leibniz University Hannover working on learning-based control for legged robots."
url                      : "https://manuelweiss.info"
baseurl                  : ""
repository               : "ma-weiss/ma-weiss.github.io"
timezone                 : Europe/Berlin
future                   : true

# Sidebar author profile (blank fields are hidden; see _includes/author-profile.html)
author:
  avatar                 : "profile_digit.png"
  name                   : "Manuel Weiss"
  bio                    : 'Robotics, Data Driven Control <br> @<a href="https://www.bht-berlin.de/en/">BHT</a> @<a href="https://www.uni-hannover.de/en/">LUH</a>'
  location               : "BLN, BNE, MUC"
  employer               : "BHT Berlin, LU Hannover"
  googlescholar          : "https://scholar.google.com/citations?user=rVmmxF8AAAAJ&hl=en"
  orcid                  : "https://orcid.org/0009-0007-0631-3250"
  github                 : "ma-weiss"
  linkedin               : "manuel-weiss-ab480813b"

# Structured data (JSON-LD) profile links
social:
  type                   : Person
  links:
    - "https://scholar.google.com/citations?user=rVmmxF8AAAAJ"
    - "https://orcid.org/0009-0007-0631-3250"
    - "https://github.com/ma-weiss"
    - "https://www.linkedin.com/in/manuel-weiss-ab480813b"

# Features
analytics:
  provider               : false
atom_feed:
  hide                   : true

# Reading files
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor

# Conversion
markdown: kramdown
kramdown:
  input: GFM

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/

# Front matter defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

# HTML compression (_layouts/compress.html)
compress_html:
  clippings: all
  ignore:
    envs: development
